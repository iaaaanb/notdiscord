<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>notdiscord</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Pantalla de entrada -->
  <div id="join" class="join">
    <form id="join-form">
      <h1>notdiscord</h1>
      <p class="hint">Elige un nick para entrar</p>
      <input id="nick" type="text" maxlength="32" placeholder="tu nick" autocomplete="off" autofocus>
      <button type="submit">Entrar</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </div>

  <!-- Chat -->
  <div id="chat" class="chat" hidden>
    <aside>
      <p class="hint">Canales</p>
      <ul id="channels"></ul>
      <form id="chan-form">
        <input id="chan" type="text" maxlength="32" placeholder="nuevo canal" autocomplete="off">
        <button type="submit" aria-label="Crear canal">+</button>
      </form>
      <p class="hint">Online</p>
      <ul id="online"></ul>
      <p class="status-row">
        <span id="status" class="status" data-state="connecting">conectando…</span>
        <button id="retry" type="button" class="linkish" hidden>reintentar</button>
      </p>
    </aside>
    <main>
      <header><h2 id="channel-title"># general</h2></header>
      <div class="log-wrap">
        <ul id="log" aria-live="polite"></ul>
        <button id="jump" type="button" class="jump" hidden></button>
      </div>
      <form id="msg-form">
        <input id="msg" type="text" maxlength="2000" placeholder="Mensaje" autocomplete="off">
        <button id="msg-send" type="submit">Enviar</button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
